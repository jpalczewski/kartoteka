name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

# A new push to the same PR supersedes the running one; runs on develop always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all -- --check

  # Clippy and tests in ONE job: the toolchain is installed once and the debug `target/` is shared,
  # instead of two runners each paying for a cold build. The cache is written only on develop;
  # PRs restore it read-only.
  check:
    name: Clippy & Tests
    runs-on: ubuntu-24.04
    env:
      # Many large test binaries: link them with mold instead of GNU ld.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v7
      - name: Install mold
        run: sudo apt-get install -y mold
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: check
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-nextest
      - name: Clippy (workspace, all targets)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (frontend, SSR)
        run: cargo clippy -p kartoteka-frontend --features ssr -- -D warnings
      - name: Clippy (frontend, hydrate/WASM)
        run: cargo clippy -p kartoteka-frontend --features hydrate --target wasm32-unknown-unknown -- -D warnings
      - name: Tests
        run: cargo nextest run --workspace
      - name: Doc tests
        run: cargo test --workspace --doc

  deny:
    name: Deny (licenses & advisories)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  machete:
    name: Unused dependencies
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-machete
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-machete
      - name: Check unused dependencies
        run: |
          set +e
          OUTPUT=$(cargo machete 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"

          echo "## Unused Dependencies" >> "$GITHUB_STEP_SUMMARY"
          if [ $EXIT_CODE -ne 0 ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$OUTPUT" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            # Emit annotations visible in PR
            echo "$OUTPUT" | grep "crate " | while IFS= read -r line; do
              echo "::warning::$line"
            done
          else
            echo "No unused dependencies found." >> "$GITHUB_STEP_SUMMARY"
          fi
