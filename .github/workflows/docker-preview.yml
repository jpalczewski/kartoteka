name: Docker Preview

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: docker-preview
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/docker-build.yml
    with:
      image_tag: preview
      cargo_profile: release
