name: Docker Preview

on:
  pull_request:
    branches: [develop, main]

# One group per PR: a push only cancels that PR's own stale build, never another PR's.
# The shared :preview tag is last-writer-wins: it points at the most recently finished PR build.
concurrency:
  group: docker-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/docker-build.yml
    with:
      image_tag: preview
      cargo_profile: release
