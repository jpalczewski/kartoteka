name: Docker Build

on:
  workflow_call:
    inputs:
      image_tag:
        description: Primary tag for the pushed image
        required: true
        type: string
      cargo_profile:
        description: debug or release
        required: true
        type: string
      extra_tags:
        description: Newline-separated additional tags
        required: false
        type: string
        default: ""

jobs:
  build:
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: write
    env:
      CARGO_TARGET_DIR: /home/github-runner/.cache/kartoteka/target
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        run: |
          command -v rustup || \
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          . "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show

      - name: Install cargo-leptos
        run: |
          cargo leptos --version 2>/dev/null | grep -q '0.3.5' || \
            cargo install cargo-leptos --version 0.3.5 --locked

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Build CSS
        run: cd crates/frontend && npm install && npx @tailwindcss/cli -i style/input.css -o style/main.css --minify

      - name: Build binary and site
        env:
          CARGO_PROFILE: ${{ inputs.cargo_profile }}
        run: |
          if [ "$CARGO_PROFILE" = "release" ]; then
            cargo leptos build --release
          else
            cargo leptos build
          fi

      - name: Stage artifacts
        env:
          CARGO_PROFILE: ${{ inputs.cargo_profile }}
        run: |
          rm -rf dist && mkdir -p dist/site dist/locales
          PROFILE_DIR=$([ "$CARGO_PROFILE" = "release" ] && echo "release" || echo "debug")
          cp "${CARGO_TARGET_DIR}/${PROFILE_DIR}/kartoteka" dist/kartoteka
          cp "${CARGO_TARGET_DIR}/${PROFILE_DIR}/hash.txt" dist/hash.txt
          cp -r target/site/. dist/site/
          cp -r locales/. dist/locales/

      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble tags
        id: tags
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          EXTRA_TAGS: ${{ inputs.extra_tags }}
          REPO: ${{ github.repository }}
        run: |
          TAGS="ghcr.io/${REPO}:${IMAGE_TAG}"
          if [ -n "$EXTRA_TAGS" ]; then
            while IFS= read -r extra; do
              [ -z "$extra" ] && continue
              TAGS="$TAGS,ghcr.io/${REPO}:$extra"
            done <<< "$EXTRA_TAGS"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          TAG_ARGS=$(echo "$TAGS" | tr ',' '\n' | sed 's/^/--tag /' | tr '\n' ' ')
          docker buildx build \
            --builder persistent \
            --file Dockerfile.runtime \
            --push \
            $TAG_ARGS \
            dist/
