name: Docker Build

on:
  workflow_call:
    inputs:
      image_tag:
        description: Primary tag for the pushed image
        required: true
        type: string
      cargo_profile:
        description: debug or release
        required: true
        type: string
      extra_tags:
        description: Newline-separated additional tags
        required: false
        type: string
        default: ""

jobs:
  build:
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble tags
        id: tags
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          EXTRA_TAGS: ${{ inputs.extra_tags }}
          REPO: ${{ github.repository }}
        run: |
          TAGS="ghcr.io/${REPO}:${IMAGE_TAG}"
          if [ -n "$EXTRA_TAGS" ]; then
            while IFS= read -r extra; do
              [ -z "$extra" ] && continue
              TAGS="$TAGS,ghcr.io/${REPO}:$extra"
            done <<< "$EXTRA_TAGS"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          CARGO_PROFILE: ${{ inputs.cargo_profile }}
        run: |
          TAG_ARGS=$(echo "$TAGS" | tr ',' '\n' | sed 's/^/--tag /' | tr '\n' ' ')
          docker buildx build \
            --builder persistent \
            --cache-from type=local,src=/tmp/buildx-cache \
            --cache-to type=local,dest=/tmp/buildx-cache,mode=max \
            --build-arg CARGO_PROFILE="$CARGO_PROFILE" \
            --push \
            $TAG_ARGS \
            .
