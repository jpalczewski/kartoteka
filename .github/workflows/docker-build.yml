name: Docker Build

on:
  workflow_call:
    inputs:
      image_tag:
        description: Primary tag for the pushed image
        required: true
        type: string
      cargo_profile:
        description: debug or release
        required: true
        type: string
      extra_tags:
        description: Newline-separated additional tags
        required: false
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      # Headroom for the release target dir (server + WASM); the preinstalled SDKs are not needed.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: docker-${{ inputs.cargo_profile }}
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - uses: cargo-bins/cargo-binstall@851112458b5f28a29e5bc14a690c3f283d9dcc6f # v1.26.2
      - name: Install cargo-leptos
        run: cargo binstall -y --locked cargo-leptos@0.3.5

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build CSS
        run: cd crates/frontend && npm install && npx @tailwindcss/cli -i style/input.css -o style/main.css --minify

      - name: Build binary and site
        env:
          CARGO_PROFILE: ${{ inputs.cargo_profile }}
        run: |
          if [ "$CARGO_PROFILE" = "release" ]; then
            cargo leptos build --release
          else
            cargo leptos build
          fi

      - name: Stage artifacts
        env:
          CARGO_PROFILE: ${{ inputs.cargo_profile }}
        run: |
          rm -rf dist && mkdir -p dist/site dist/locales
          PROFILE_DIR=$([ "$CARGO_PROFILE" = "release" ] && echo "release" || echo "debug")
          cp "target/${PROFILE_DIR}/kartoteka" dist/kartoteka
          cp "target/${PROFILE_DIR}/hash.txt" dist/hash.txt
          cp -r target/site/. dist/site/
          cp -r locales/. dist/locales/

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble tags
        id: tags
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          EXTRA_TAGS: ${{ inputs.extra_tags }}
          REPO: ${{ github.repository }}
        run: |
          TAGS="ghcr.io/${REPO}:${IMAGE_TAG}"
          if [ -n "$EXTRA_TAGS" ]; then
            while IFS= read -r extra; do
              [ -z "$extra" ] && continue
              TAGS="$TAGS,ghcr.io/${REPO}:$extra"
            done <<< "$EXTRA_TAGS"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          TAG_ARGS=$(echo "$TAGS" | tr ',' '\n' | sed 's/^/--tag /' | tr '\n' ' ')
          docker buildx build \
            --file Dockerfile.runtime \
            --push \
            $TAG_ARGS \
            dist/
