[advisories]
yanked = "deny"
unmaintained = "workspace"
unsound = "workspace"

ignore = [
    # rsa crate: Marvin Attack timing side-channel, no patch available upstream
    "RUSTSEC-2023-0071",
    # crypto-bigint 0.5: timing variability, fix only in 0.7. Pulled by p256/p384 via
    # jsonwebtoken `rust_crypto` (no newer release drops it). We sign/verify HS256 only,
    # so the ECDSA code paths are never executed.
    "RUSTSEC-2026-0387",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
